# Cargo config for the degenbot workspace builds (cargo/maturin/uv all run
# from the repo root, so this file is discovered by every build path incl.
# the PyO3 cdylib rebuild and rust-analyzer's isolated target dir).
[build]
# hotpath's tokio runtime monitor reads tokio::runtime::RuntimeMetrics fields
# that tokio only ships under its unstable cfg (ergo task 2N6UKZ). harmless
# elsewhere: it only widens tokio's own API surface. One-time full-rebuild
# cost when introduced; afterwards cached.
rustflags = ["--cfg", "tokio_unstable"]
